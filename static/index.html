<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المساعد الصوتي</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0f0f0f; color: #f0f0f0;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 100vh; gap: 20px; padding: 20px;
    }
    h1 { font-size: 1.3rem; color: #888; font-weight: 300; }
    #status {
      font-size: 1rem; color: #aaa; min-height: 28px; text-align: center;
      padding: 6px 16px; border-radius: 20px; background: #1a1a1a;
    }
    #status.listening  { color: #4ad94a; background: #0d1f0d; }
    #status.speaking   { color: #4a90d9; background: #0d1420; }
    #status.processing { color: #d9a84a; background: #1f160d; }
    .box {
      width: 100%; max-width: 580px; min-height: 70px; max-height: 220px;
      overflow-y: auto;
      border-radius: 12px; padding: 14px 18px; font-size: 1.05rem; line-height: 1.7;
    }
    #transcript-box { background: #1a1a1a; border: 1px solid #2a2a2a; color: #ccc; }
    #response-box   { background: #111e11; border: 1px solid #1a3a1a; color: #90e090; }
    .box .label { font-size: 0.72rem; color: #555; margin-bottom: 4px; }
    #connect-btn {
      width: 88px; height: 88px; border-radius: 50%;
      background: #1a1a2e; border: 3px solid #4a4a8a;
      color: #fff; font-size: 2.2rem; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center;
    }
    #connect-btn.connected {
      background: #0d2a0d; border-color: #4ad94a; animation: breathe 2s infinite;
    }
    #connect-btn.ai-speaking { background: #0d1a2e; border-color: #4a90d9; }
    #connect-btn.user-speaking { background: #2a0d0d; border-color: #d94a4a; }
    @keyframes breathe {
      0%,100% { box-shadow: 0 0 0 0 rgba(74,217,74,0.3); }
      50%      { box-shadow: 0 0 0 14px rgba(74,217,74,0); }
    }
    #hint { font-size: 0.78rem; color: #444; text-align: center; }
    #connect-btn:disabled { opacity: 0.35; cursor: not-allowed; animation: none; }
  </style>
</head>
<body>
  <h1>المساعد الصوتي</h1>

  <div id="status">اضغط للاتصال</div>

  <div class="box" id="transcript-box">
    <div class="label">أنت:</div>
    <div id="transcript-text" dir="auto"></div>
  </div>

  <div class="box" id="response-box">
    <div class="label">المساعد:</div>
    <div id="response-text" dir="auto"></div>
  </div>

  <button id="connect-btn">🎙️</button>
  <div id="hint">اضغط للاتصال — سيستمع تلقائياً بعد ذلك</div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const CHUNK_SIZE  = 512;
const SAMPLE_RATE = 16000;

// ── State ────────────────────────────────────────────────────────────────────
let ws          = null;
let audioCtx    = null;   // 16 kHz context — mic capture only
let playCtx     = null;   // native-rate context — playback only. Decoding the 24 kHz
                          // TTS audio in the 16 kHz mic context would resample it
                          // down and cut everything above 8 kHz (muffled voice).
let workletNode = null;
let micStream   = null;
let connected      = false;
let serverReady    = false;  // gate mic chunks until the server says 'ready' — no point
                             // streaming audio into a server still loading models
let responseBuffer = '';     // accumulates response tokens — avoids O(n) textContent += per token

// Playback: sources are scheduled sample-accurately on playCtx's clock.
let activeSources = [];
let nextStartTime = 0;
let playGen       = 0;                   // bumped on clear — invalidates in-flight decodes
let decodeChain   = Promise.resolve();   // serializes decodes so sentences play in order
let isPlaying     = false;

// Barge-in is handled SERVER-SIDE by the Silero VAD: when the user speaks over
// the AI, the server detects real speech (not breathing/noise) and sends a
// `speech_start` event, which stops playback (see the onmessage handler).
// There is no client-side energy detector — Silero discriminates speech from
// noise far better than raw loudness could.

// Watchdog: the server pings every 3s. If NOTHING arrives for 10s the socket
// is half-dead (UI stays green but mic audio goes nowhere) → auto-reconnect.
let lastMsgTime   = 0;
let watchdogTimer = null;
let reconnectDelay = 500;   // exponential backoff: 0.5s → 1s → 2s … capped at 10s
let wantReconnect  = false; // true while the user wants a session (cleared by ⏹️)
let reconnectTimer = null;  // setTimeout handle — tracked so we can cancel it

// ── DOM ───────────────────────────────────────────────────────────────────────
const statusEl     = document.getElementById('status');
const transcriptEl = document.getElementById('transcript-text');
const responseEl   = document.getElementById('response-text');
const connectBtn   = document.getElementById('connect-btn');
const hintEl       = document.getElementById('hint');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className   = cls || '';
}

// ── AudioWorklet inline ──────────────────────────────────────────────────────
const WORKLET_CODE = `
class MicSender extends AudioWorkletProcessor {
  constructor() {
    super();
    this._buf = new Float32Array(${CHUNK_SIZE});
    this._pos = 0;
  }
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this._buf[this._pos++] = ch[i];
      if (this._pos === ${CHUNK_SIZE}) {
        this.port.postMessage(this._buf.slice(0));
        this._pos = 0;
      }
    }
    return true;
  }
}
registerProcessor('mic-sender', MicSender);
`;

// ── Connect / disconnect ─────────────────────────────────────────────────────
connectBtn.addEventListener('click', async () => {
  if (connected) { wantReconnect = false; disconnect(); } else { await connect(); }
});

let connecting = false;   // guards against overlapping connect() calls

async function connect() {
  if (connecting || connected) return;   // never run two connects at once
  connecting = true;
  setStatus('جاري الاتصال...', '');

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: false,
    });
  } catch (e) {
    setStatus('⚠️ لا يمكن الوصول إلى الميكروفون: ' + e.message, '');
    connecting = false;
    return;
  }

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  playCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (playCtx.state === 'suspended') await playCtx.resume();

  const blob      = new Blob([WORKLET_CODE], { type: 'application/javascript' });
  const workletUrl = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(workletUrl);
  URL.revokeObjectURL(workletUrl);

  const source = audioCtx.createMediaStreamSource(micStream);
  workletNode  = new AudioWorkletNode(audioCtx, 'mic-sender');
  source.connect(workletNode);

  const WS_PROTO = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const WS_URL = `${WS_PROTO}${location.host}/ws`;
  wantReconnect = true;

  // Socket-scoped handlers: `sock` is captured locally so a STALE socket's
  // late onclose/onerror can NEVER tear down a newer session. (That race —
  // old socket's onclose killing the new mic stream — caused the "stays green
  // but deaf" state.)
  const sock = new WebSocket(WS_URL);
  sock.binaryType = 'arraybuffer';
  ws = sock;

  sock.onopen = () => {
    if (sock !== ws) { try { sock.close(); } catch (_) {} return; }  // superseded
    connected  = true;
    connecting = false;
    connectBtn.textContent = '⏹️';
    workletNode.port.onmessage = (e) => {
      // Mic chunks stream to the server, which runs VAD/STT and handles barge-in.
      // serverReady gate: don't stream mic audio into a server that is still
      // loading models — it would pile up unread in the socket buffer.
      if (serverReady && ws === sock && sock.readyState === WebSocket.OPEN) sock.send(e.data.buffer);
    };
    // Start the dead-connection watchdog (server pings every 3s).
    lastMsgTime = Date.now();
    watchdogTimer = setInterval(() => {
      // 20s (server pings every 3s). Raised from 10s so a brief SSH-tunnel/network
      // stall during a long reply can't falsely declare the connection dead.
      if (connected && Date.now() - lastMsgTime > 20000) {
        console.warn('[watchdog] no server message for >20s — reconnecting');
        setStatus('انقطع الاتصال — إعادة الاتصال...', 'processing');
        disconnect();
        scheduleReconnect();
      }
    }, 2500);
  };

  sock.onclose  = (ev) => {
    console.warn('[ws] closed — code=', ev.code, 'reason=', ev.reason || '(none)', 'wasClean=', ev.wasClean);
    if (sock !== ws) return;
    disconnect(false);
    if (ev.code === 4001) {
      // Server sent "superseded" — another tab or reconnect took over this session.
      // Do NOT reconnect; the other tab is now active. Just show a quiet status.
      wantReconnect = false;
      setStatus('الجلسة نشطة في نافذة أخرى', '');
      return;
    }
    // Any other unexpected close (server restart, network blip, tunnel drop) — retry.
    if (wantReconnect) {
      setStatus('انقطع الاتصال — إعادة الاتصال...', 'processing');
      scheduleReconnect();
    }
  };
  sock.onerror  = () => { if (sock === ws) setStatus('⚠️ خطأ في الاتصال', ''); };
  sock.onmessage = (e) => { if (sock === ws) handleMessage(e); };
  // NOTE: connecting is reset to false inside sock.onopen (on success) or inside
  // disconnect() (on failure/close). Do NOT reset it here — this function returns
  // before onopen fires, so resetting here creates a window where a second connect()
  // call can slip through while the first socket is still being established.
}

function scheduleReconnect() {
  if (reconnectTimer) return;  // already pending — don't double-schedule
  reconnectDelay = Math.min(reconnectDelay * 2, 10000);
  reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, reconnectDelay);
}

function disconnect(stopServer = true) {
  connected   = false;
  connecting  = false;
  serverReady = false;
  if (watchdogTimer)  { clearInterval(watchdogTimer);  watchdogTimer  = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer);  reconnectTimer = null; }
  connectBtn.textContent = '🎙️';
  connectBtn.className   = '';
  connectBtn.disabled    = false;   // re-enable even if we dropped mid-'loading'
  hintEl.textContent     = 'اضغط للاتصال — سيستمع تلقائياً بعد ذلك';
  setStatus('اضغط للاتصال', '');

  clearAudioQueue();
  if (workletNode) { workletNode.port.onmessage = null; workletNode.disconnect(); workletNode = null; }
  if (micStream)   { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx)    { audioCtx.close(); audioCtx = null; }
  if (playCtx)     { playCtx.close(); playCtx = null; }
  // Always close + detach the socket we are abandoning, so its late events
  // can't fire into a future session.
  const sock = ws;
  ws = null;
  if (sock) {
    sock.onopen = sock.onclose = sock.onerror = sock.onmessage = null;
    try { sock.close(); } catch (_) {}
  }
}

// ── WebSocket message handler ─────────────────────────────────────────────────
function handleMessage(event) {
  lastMsgTime = Date.now();   // any server message (incl. ping/audio) feeds the watchdog

  if (event.data instanceof ArrayBuffer) { queueMp3(event.data); return; }

  const msg = JSON.parse(event.data);

  if (msg.event === 'ping') return; // keepalive — ignore silently

  if (msg.event === 'loading') {
    setStatus('جاري تحميل النماذج...', 'processing');
    connectBtn.disabled = true;
    return;
  }
  if (msg.event === 'ready') {
    serverReady          = true;
    reconnectDelay       = 500;   // healthy session — reset the backoff
    connectBtn.disabled  = false;
    connectBtn.className = 'connected';
    hintEl.textContent   = 'يستمع... تحدث بشكل طبيعي';
    setStatus('يستمع...', 'listening');
    return;
  }
  if (msg.event === 'speech_start') {
    // PAUSE playback — don't destroy it. If STT then rejects the utterance
    // (cough, noise, echo), the server sends `speech_rejected` and we resume
    // exactly where we stopped. Only an ACCEPTED utterance (a `transcript`
    // event) actually clears the audio queue.
    pausePlayback();
    // Don't clear the response box here: if the AI was still thinking, its
    // answer keeps streaming — the box is cleared on the next transcript.
    connectBtn.className   = 'connected user-speaking';
    setStatus('تتحدث...', 'speaking');
  }
  if (msg.event === 'speech_rejected') {
    // False trigger — the utterance was dropped by STT. Resume the paused
    // audio; nothing was lost.
    resumePlayback();
    if (connected) {
      if (activeSources.length > 0 || isPlaying) {
        connectBtn.className = 'connected ai-speaking';
        setStatus('يتكلم...', 'speaking');
      } else {
        connectBtn.className = 'connected';
        setStatus('يستمع...', 'listening');
      }
    }
    return;
  }
  if (msg.event === 'transcript') {
    clearAudioQueue();               // accepted utterance — the old turn's audio is obsolete
    resumePlayback();                // un-suspend so the NEW turn's audio can play
    transcriptEl.textContent = msg.text;
    responseBuffer           = '';
    responseEl.textContent   = '';
    connectBtn.className     = 'connected';
    setStatus('جاري التفكير...', 'processing');
  }
  if (msg.event === 'token') {
    responseBuffer += msg.text;
    responseEl.textContent = responseBuffer;
    const box = document.getElementById('response-box');
    box.scrollTop = box.scrollHeight;
  }
  if (msg.event === 'tts_end') {
    // Only reset to listening immediately if nothing is playing — otherwise
    // the last source's onended handler resets the status when audio ends.
    if (!isPlaying && activeSources.length === 0) {
      connectBtn.className = 'connected';
      setStatus('يستمع...', 'listening');
    }
  }
}

// ── Audio playback: ordered decode, gapless sample-accurate scheduling ────────
const SEAM_OVERLAP = 0.05;  // swallow LAME encoder padding between sentence MP3s

function sendControl(event, extra) {
  // Tells the server the real client-side playback state, so barge-in stays
  // strict while the AI is still audible (even after the server turn ended).
  if (ws && ws.readyState === WebSocket.OPEN) {
    try { ws.send(JSON.stringify(Object.assign({ event }, extra || {}))); } catch (_) {}
  }
}

function queueMp3(arrayBuffer) {
  const gen = playGen;
  // Chain decodes: decodeAudioData resolves out of order for different-length
  // MP3s, which would scramble sentence order without this serialization.
  decodeChain = decodeChain.then(async () => {
    if (gen !== playGen || !playCtx) return;   // cleared/disconnected meanwhile
    let decoded;
    try {
      decoded = await playCtx.decodeAudioData(arrayBuffer.slice(0));
    } catch (e) { console.error('MP3 decode error:', e); return; }
    if (gen !== playGen || !playCtx) return;

    const now = playCtx.currentTime;
    if (nextStartTime < now + 0.03) nextStartTime = now + 0.03;
    const src = playCtx.createBufferSource();
    src.buffer = decoded;
    src.connect(playCtx.destination);
    src.start(nextStartTime);
    nextStartTime += Math.max(decoded.duration - SEAM_OVERLAP, 0.01);

    if (activeSources.length === 0) {
      sendControl('playback_start');
    }
    activeSources.push(src);
    isPlaying = true;
    connectBtn.className = 'connected ai-speaking';
    setStatus('يتكلم...', 'speaking');

    src.onended = () => {
      activeSources = activeSources.filter(s => s !== src);
      if (activeSources.length === 0) {
        isPlaying = false;
        sendControl('playback_done');
        if (connected) { connectBtn.className = 'connected'; setStatus('يستمع...', 'listening'); }
      }
    };
  }).catch(e => console.error('playback error:', e));
}

function pausePlayback() {
  // Suspend the playback clock — scheduled sources freeze in place and any MP3s
  // that keep arriving (the turn is still streaming server-side) queue silently.
  if (playCtx && playCtx.state === 'running') playCtx.suspend().catch(() => {});
}

function resumePlayback() {
  if (playCtx && playCtx.state === 'suspended') playCtx.resume().catch(() => {});
}

function clearAudioQueue() {
  playGen++;                        // invalidate decodes still in flight
  decodeChain = Promise.resolve();
  const wasPlaying = activeSources.length > 0;
  activeSources.forEach(s => { s.onended = null; try { s.stop(); } catch (_) {} });
  activeSources = [];
  nextStartTime = 0;
  isPlaying     = false;
  if (wasPlaying) sendControl('playback_done');
}
</script>
</body>
</html>
